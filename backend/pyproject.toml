[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "trading-engine-backend"
version = "1.0.0"
description = "Real-time trading alert engine using Alpaca Markets API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.13.3",
    "alembic>=1.17.2",
    "alpaca-py>=0.43.2",
    "asyncpg>=0.31.0",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.45",
    # Explicit, not transitive: the scanner's correctness depends on resolving
    # America/New_York, and Windows ships no system tz database for zoneinfo.
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.40.0",
    "websockets>=15.0.1",
    "mcp[cli]>=1.2.0",
]

[dependency-groups]
dev = [
    # aiosqlite powers the in-memory test database only; the app itself is Postgres-only.
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.14.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# N818 wants an "Error" suffix on exception names. The FMP/scanner error taxonomy is
# named by docs/PROMPT.md (BudgetExhausted, RateLimited, SymbolNotAvailable, ...) and
# those names are part of the phase contract, so the spec wins over the convention.
"app/services/fmp/errors.py" = ["N818"]
"app/services/fmp/fixtures.py" = ["N818"]
"app/services/scanner/errors.py" = ["N818"]
"app/services/scanner/snapshot.py" = ["N818"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

# Render Blueprint — Trading Engine v2
# https://render.com/docs/blueprint-spec
#
# Topology (v2):
#   - Web service: always-on FastAPI (REST + client WebSocket)
#   - Cron job:    pre-market scanner stub (Phase 2 will replace the entrypoint)
#   - Database:    Supabase Postgres — NOT managed by this blueprint
#
# Timezone note: Render cron schedules are UTC. The pre-market window is
# 04:00–09:25 America/New_York, which is UTC−5 (EST) or UTC−4 (EDT). A
# UTC-pinned schedule silently shifts by one hour twice a year — the scanner
# code itself (Phase 2) must convert to ET and gate real work on the ET clock.
# The schedule below is a generous placeholder for the stub only.
#
# ---------------------------------------------------------------------------
# Supabase endpoints — which service uses which port
# ---------------------------------------------------------------------------
#   Transaction pooler   aws-<region>.pooler.supabase.com:6543  -> DATABASE_URL
#       App runtime and the cron job. Many short queries multiplexed over few
#       server connections; pgBouncer returns the server connection to the pool
#       after every transaction.
#
#   Session pooler       aws-<region>.pooler.supabase.com:5432  -> MIGRATION_DATABASE_URL
#       `alembic upgrade head`. The server connection is held for the whole
#       client session, which is what DDL and Alembic's version bookkeeping
#       assume. This is the endpoint Supabase documents for migrations.
#
# Both endpoints are made pgBouncer-safe in code by `app/core/db_connect.py`
# (statement caches off + UUID prepared-statement names), so migrations work
# against 6543 too — 5432 is simply the correct endpoint for DDL.
#
# HISTORY — do not "simplify" this back: the comment here used to claim "the
# engine detects the pooler host and disables the prepared-statement cache
# automatically". That was true of the APP engine and false of Alembic, which
# built its own engine via async_engine_from_config and applied none of it:
#   asyncpg.exceptions.DuplicatePreparedStatementError:
#   prepared statement "__asyncpg_stmt_1__" already exists
# Both paths now import the same helper. Two copies of that rule will drift.

services:
  # Backend API + client WebSocket (always-on)
  - type: web
    name: trading-engine-api
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: |
      cd backend && pip install -e .
    # Migrations run BEFORE the new container takes traffic (Phase 4C).
    #
    # They used to run inside startCommand, which was a deliberate trade-off while the
    # service was on the free plan — Render's pre-deploy hook needs a paid instance. Now
    # that `plan: starter` is here for always-on operation, the hook is available and the
    # failure mode improves materially: a bad migration stops the DEPLOY, leaving the
    # previous version serving, instead of stopping a RUNNING SERVICE mid-morning.
    #
    # That distinction matters most for this app specifically. The scanner's authoritative
    # pass is 09:25 ET; a failed boot during pre-market would take the dashboard down at
    # exactly the moment the user is looking at it.
    #
    # The advisory lock in alembic/env.py stays regardless — the cron and the web service
    # are separate processes and must not race.
    preDeployCommand: |
      cd backend && alembic upgrade head
    startCommand: |
      cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      # App runtime: TRANSACTION pooler, port 6543.
      #   postgresql+asyncpg://postgres.<ref>:<pw>@aws-<region>.pooler.supabase.com:6543/postgres
      # Set in the Render dashboard (sync: false keeps credentials out of the blueprint).
      - key: DATABASE_URL
        sync: false
      # Migrations: SESSION pooler, port 5432 — same host, different port.
      #   postgresql+asyncpg://postgres.<ref>:<pw>@aws-<region>.pooler.supabase.com:5432/postgres
      # Optional: if unset, Alembic falls back to DATABASE_URL, which also works but is
      # not the endpoint Supabase intends for DDL.
      - key: MIGRATION_DATABASE_URL
        sync: false
      # FMP — v2 data provider. Consumed by Phase 1+.
      - key: FMP_API_KEY
        sync: false
      - key: FMP_BASE_URL
        value: https://financialmodelingprep.com
      # Point this at the Vercel frontend URL; multiple origins comma-separated.
      - key: CORS_ORIGINS
        sync: false
    healthCheckPath: /health

  # Pre-market scanner cron (wired to the real scanner — Phase 3)
  #
  # The schedule is deliberately GENEROUS in UTC: 09:00–14:30 UTC covers the widest
  # possible 04:00–09:25 ET window across both DST offsets. The scanner then gates the
  # actual work on a computed ET timestamp and records `skipped` for wake-ups outside
  # the window. Tightening this schedule to "the right" UTC hours would reintroduce the
  # twice-yearly one-hour drift that the ET gate exists to eliminate.
  #
  # SCHEDULER LATENCY IS THE GATE'S PROBLEM, NOT THE SCHEDULE'S. Render starts a job
  # 10–45 s after its scheduled minute, so the 13:25 UTC entry — the authoritative 09:25
  # ET pass — actually begins around 09:25:10 ET. It was rejected as "outside" a window
  # ending at 09:25 and never ran in production. The fix is in the gate, which now
  # compares at minute resolution; do NOT try to fix it here by moving the schedule
  # earlier, which would only trade this failure for a differently-timed one.
  #
  # LIVE as of Phase 4C: `--fixture` is gone and `FmpLiveSnapshotProvider` supplies Stage 2
  # from `extended=true` pre-market bars.
  #
  # ---------------------------------------------------------------------------
  # `--no-alerts` IS DELIBERATE. Do not remove it without reading this.
  # ---------------------------------------------------------------------------
  # The scan runs in full and WRITES the `scan_runs` row — status, per-stage counts,
  # rejection reasons, timings, calls, bytes, integrity findings — but persists and
  # broadcasts NO alerts. That is stage 1 of a two-stage go-live: nobody yet knows how many
  # candidates a real morning produces. If it turns out to be 200, the thresholds need
  # tuning BEFORE the end user opens a dashboard full of noise, and tuning from `scan_runs`
  # history is far easier than tuning from a user who has stopped trusting the tool.
  #
  # THIS BLOCK USED TO SAY `--dry-run`, AND THAT WAS A BUG — it is why the correction is
  # spelled out rather than quietly edited. `--dry-run` has meant "touch nothing" since
  # Phase 2; reusing it here made the cron run a full live scan every five minutes and
  # discard the result, so `scan_runs` gained no rows for the whole observation window and
  # the comment described behaviour the code did not have. The two modes are now separate
  # flags, and the mode is recorded on the row itself:
  #
  #   --no-alerts   observation — scan_runs written, alerts NOT persisted or broadcast
  #   --dry-run     nothing written at all; local testing only
  #   (neither)     live — scan_runs written, alerts persisted and broadcast
  #
  # Promote to stage 2 by deleting `--no-alerts` once several sessions look sane:
  #   SELECT started_at, mode, status, stage_counts_json->'counts'
  #   FROM scan_runs ORDER BY started_at DESC;
  #
  # Zero candidates is a legitimate outcome and is recorded as a SUCCESSFUL scan of a quiet
  # market, not a failure — and `mode` now distinguishes "found nothing" from "was not
  # allowed to write anything". The dashboard shows it as such.
  - type: cron
    name: trading-engine-premarket-scan
    runtime: python
    plan: starter
    region: frankfurt
    schedule: "*/5 8-14 * * 1-5"
    buildCommand: |
      cd backend && pip install -e .
    startCommand: |
      cd backend && python scripts/run_scan.py --profile production
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: APP_ENV
        value: production
      # The cron writes alerts and scan_runs, so it needs the same Postgres the API uses:
      # the TRANSACTION pooler (port 6543). The cron does NOT run migrations, so it needs
      # no MIGRATION_DATABASE_URL.
      - key: DATABASE_URL
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: FMP_BASE_URL
        value: https://financialmodelingprep.com
      # Keep the cron's budget accounting identical to the API's.
      - key: FMP_DAILY_BUDGET
        value: "80000"
      # Time-of-day-normalized RVOL, against the profiles Phase 4B built. The scanner
      # degrades to simple RVOL per ticker (flagged on the alert) when a profile is
      # missing or thin, so a newly-listed name is not silently dropped.
      - key: RVOL_MODE
        value: normalized
      # A bar is provisional until this long after it closes: 4A measured 49.4% of
      # pre-market bars revised upward, all settling within 7 minutes. Both sides of the
      # RVOL division use this same window.
      - key: BAR_SETTLE_MINUTES
        value: "7"
      # Live fan-out: one call per Stage-1 candidate, paced below FMP's 750/min.
      - key: LIVE_SNAPSHOT_CONCURRENCY
        value: "8"
      - key: LIVE_SNAPSHOT_MAX_PER_MINUTE
        value: "700"
      # Accumulated volume above this multiple of the 20-day average is flagged as a
      # probable data fault — recorded, never silently dropped.
      - key: SCAN_VOLUME_SANITY_MULTIPLE
        value: "50"
      - key: SCAN_PROFILE
        value: production

  # ---------------------------------------------------------------------------
  # Nightly reference-data refresh
  # ---------------------------------------------------------------------------
  # WHY THIS EXISTS: Phase 4B built the universe, reference data and volume profiles as
  # CLI scripts, but nothing ever scheduled them. Without this service the pre-market scan
  # runs every morning against data that never changes: `volume_avg_20d`, `sma_50`,
  # `sma_200`, `high_20d` and `price_close_yesterday` all silently age, and
  # `premarket_volume_profile` stops reflecting the last 20 sessions. The scan would keep
  # succeeding and keep reporting candidates — computed from stale levels. That is the
  # failure mode this project cares most about: wrong, not broken.
  #
  # ORDER IS A DEPENDENCY, NOT A PREFERENCE. `&&` is deliberate:
  #   build_universe        -> screener + shares-float-all -> `universe`
  #   refresh_reference_data-> EOD history per ticker      -> `reference_data`  (needs universe)
  #   build_volume_profiles -> extended=true intraday       -> profiles          (needs Stage-1 set)
  # If one step fails the chain stops, which is correct: better yesterday's complete data
  # than today's half-built data.
  #
  # SCHEDULE: 23:00 UTC = 19:00 EDT / 18:00 EST, three-plus hours after the 16:00 ET close,
  # so EOD data has settled. Runs Mon-Fri, which covers Tue-Sat mornings; Friday night's
  # run is what Monday's pre-market uses, and that is correct — Friday's close IS Monday's
  # `price_close_yesterday`.
  #
  # Unlike the scan cron this schedule needs no ET gating: it is a once-daily job with a
  # multi-hour window on either side, so the DST hour-shift is harmless.
  #
  # DURATION: measured against Supabase at ~1.22 s per FMP call — reference refresh ~3,900
  # calls (~80 min), profiles ~2,800 calls (~55 min). Budget ~2.5 h. It must finish well
  # before the 08:00 UTC pre-market window; starting at 23:00 UTC leaves ~9 hours.
  - type: cron
    name: trading-engine-nightly-refresh
    runtime: python
    plan: starter
    region: frankfurt
    schedule: "0 23 * * 1-5"
    buildCommand: |
      cd backend && pip install -e .
    startCommand: |
      cd backend && python scripts/build_universe.py && python scripts/refresh_reference_data.py && python scripts/build_volume_profiles.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: APP_ENV
        value: production
      # TRANSACTION pooler (6543), same as the scan cron. No migrations here, so no
      # MIGRATION_DATABASE_URL.
      - key: DATABASE_URL
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: FMP_BASE_URL
        value: https://financialmodelingprep.com
      # A full nightly cycle measured ~6,900 calls. The ceiling is runaway protection —
      # Premium has no daily cap — so it sits well above the expected figure but low enough
      # to stop a loop before it burns the 50 GB/30-day bandwidth allowance.
      - key: FMP_DAILY_BUDGET
        value: "80000"
      # Both sides of the RVOL division must use the same settle window: profiles are built
      # from settled bars here, and the live scan applies the identical rule. If these two
      # values ever diverge, RVOL is biased by construction and nothing surfaces the fault.
      - key: BAR_SETTLE_MINUTES
        value: "7"

# Development docker-compose - runs only the database.
# Host port 5433 is used to avoid clashing with a native Postgres install on 5432
# (common on Windows dev machines). Inside the container it still listens on 5432.
#
# Local DSN: postgresql+asyncpg://postgres:postgres@localhost:5433/trading_engine

services:
  db:
    image: postgres:16-alpine
    container_name: trading-engine-db-dev
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=trading_engine
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data_dev:

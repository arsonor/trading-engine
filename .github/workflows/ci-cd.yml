name: CI Pipeline

# Tests + build verification only.
# Deployment is handled automatically by each platform's Git integration:
#   - Render (backend web service + cron) auto-deploys on push to main via the blueprint
#   - Vercel (frontend) auto-deploys on push to main via its GitHub integration
# There is intentionally no deploy job here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Backend Tests
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run linter
        run: uv run ruff check app/

      - name: Run tests
        run: uv run pytest -v --timeout=30
        timeout-minutes: 2

  # Frontend Tests
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present

      - name: Run tests
        run: npm test -- --run

      # Compile check only. The real VITE_API_URL / VITE_WS_URL are injected by
      # Vercel at its own build time; these placeholders just let the build pass.
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000
          VITE_WS_URL: ws://localhost:8000

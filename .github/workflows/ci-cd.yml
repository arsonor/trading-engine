name: CI Pipeline

# Tests + build verification only.
# Deployment is handled automatically by each platform's Git integration:
#   - Render (backend web service + cron) auto-deploys on push to main via the blueprint
#   - Vercel (frontend) auto-deploys on push to main via its GitHub integration
# There is intentionally no deploy job here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Backend Tests
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Postgres is required by the migration round-trip tests. Those tests skip when no
    # database is reachable, and a skipped migration test is exactly how the broken
    # downgrade shipped: it round-tripped fine on an empty database and failed on every
    # populated one. Without this service they would silently never run in CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trading_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The round-trip tests derive their scratch database name from this DSN and
      # create/drop throwaway databases beside it.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/trading_engine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run linter
        run: uv run ruff check app/

      # --timeout is per-test. The migration round-trip tests shell out to the alembic
      # CLI several times each, so they carry their own longer marker; the raised
      # default here covers the subprocess overhead on a cold runner.
      # The round-trip tests FAIL rather than skip when CI is set and Postgres is
      # unreachable — a silently skipped migration test is how the broken downgrade
      # shipped in the first place. See tests/integration/test_migration_round_trip.py.
      - name: Run tests
        run: uv run pytest -v --timeout=60
        timeout-minutes: 6

  # Frontend Tests
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present

      - name: Run tests
        run: npm test -- --run

      # Compile check only. The real VITE_API_URL / VITE_WS_URL are injected by
      # Vercel at its own build time; these placeholders just let the build pass.
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000
          VITE_WS_URL: ws://localhost:8000
